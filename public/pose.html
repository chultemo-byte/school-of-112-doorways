<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex" />
<title>Door · School of 112 Doorways</title>
<script>
/* Old door links (this page with ?n=N) land on the current door page. */
(function () {
  var m = location.search.match(/[?&]n=(\d+)/);
  var n = m ? parseInt(m[1], 10) : 1;
  if (isNaN(n) || n < 1) n = 1;
  if (n > 112) n = 112;
  var target = "door-" + String(n).padStart(3, "0") + ".html";
  location.replace(target);
})();
</script>
</head>
<body style="background:#0b0a12;color:#f4efe6;font-family:Georgia,serif">
<p style="max-width:640px;margin:48px auto;padding:0 20px">Opening the door. If nothing happens, go to the <a style="color:#c9a227" href="index.html">gate</a>.</p>
</body>
</html>
