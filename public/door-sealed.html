<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex" />
<title>Opening the door · School of 112 Doorways</title>
<script>
/* Old links (door-sealed.html?n=N) land on the door page. All 112 doors are published. */
(function () {
  var m = location.search.match(/[?&]n=(\d+)/);
  var n = m ? parseInt(m[1], 10) : 1;
  if (isNaN(n) || n < 1) n = 1;
  if (n > 112) n = 112;
  location.replace("door-" + String(n).padStart(3, "0") + ".html");
})();
</script>
<style>
  body{background:#0b0a12;color:#f4efe6;font-family:Georgia,serif;margin:0}
  .wrap{max-width:640px;margin:48px auto;padding:0 20px;line-height:1.55}
  a{color:#c9a227;text-decoration:none}
</style>
</head>
<body>
<div class="wrap">
<p>Opening the door. If nothing happens, find it in the <a href="112.html">City of 112</a> or return to the <a href="index.html">gate</a>.</p>
</div>
</body>
</html>
