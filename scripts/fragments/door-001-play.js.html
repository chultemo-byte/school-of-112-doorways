<script>
(function(){
  const playBtn = document.getElementById('play');
  const resetBtn = document.getElementById('reset');
  const statusEl = document.getElementById('status');
  const captionEl = document.getElementById('caption');
  const captions = [
    'One vertical line from the midfeet through the pelvis to the crown. The mountain does not imagine — it just stands.',
    'Three points of contact: heel, big-toe mound, little-toe mound. Weight even across all three.',
    'If one goes quiet, the line leans. The quiet point is where attention lives right now.',
    'Breathe: smell a flower for four. Blow a bubble for four. Six easy cycles. Soft knees keep the line alive.',
    'Crown over heels. Not reaching up — just not sinking down. The line holds you; you do not hold the line.',
    'Six breaths. Three points. One quiet line. Then you walk into the next hour with the floor still under you.'
  ];
  let i = 0, timer = null;
  function show(n){
    i = n % captions.length;
    captionEl.innerHTML = captions[i];
    statusEl.textContent = ['Standing','Feet','Quiet point','Breath','Crown','Integrate'][i];
  }
  function start(){
    if(timer) clearInterval(timer);
    playBtn.textContent = 'Pause';
    playBtn.classList.remove('primary');
    timer = setInterval(function(){ show(i+1); }, 4200);
  }
  function stop(){
    if(timer){ clearInterval(timer); timer = null; }
    playBtn.textContent = 'Play';
    playBtn.classList.add('primary');
  }
  playBtn.addEventListener('click', function(){ if(timer) stop(); else start(); });
  resetBtn.addEventListener('click', function(){ stop(); show(0); });
  show(0);
})();
</script>
