<section class="stage reveal">
      <div class="canvas-wrap">
        <svg viewBox="0 0 320 340" role="img" aria-label="Animated figure standing in Tadasana">
          <defs>
            <radialGradient id="mist" cx="50%" cy="60%" r="60%">
              <stop offset="0%" stop-color="#c0392b" stop-opacity="0.35"/>
              <stop offset="100%" stop-color="#c0392b" stop-opacity="0"/>
            </radialGradient>
            <linearGradient id="line" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="#f4efe6" stop-opacity="0.9"/>
              <stop offset="100%" stop-color="#c9a227" stop-opacity="0.5"/>
            </linearGradient>
          </defs>

          <!-- breath mist -->
          <ellipse class="mist" cx="160" cy="150" rx="90" ry="120" fill="url(#mist)"/>

          <!-- ground -->
          <line x1="60" y1="300" x2="260" y2="300" stroke="rgba(255,255,255,.18)" stroke-width="1"/>
          <line x1="60" y1="300" x2="60" y2="306" stroke="rgba(255,255,255,.18)" stroke-width="1"/>
          <line x1="260" y1="300" x2="260" y2="306" stroke="rgba(255,255,255,.18)" stroke-width="1"/>

          <!-- vertical axis line -->
          <line x1="160" y1="60" x2="160" y2="300" stroke="url(#line)" stroke-width="1" stroke-dasharray="2 4" opacity="0.6"/>

          <!-- figure: head -->
          <circle cx="160" cy="78" r="16" fill="none" stroke="#f4efe6" stroke-width="1.6"/>
          <!-- neck -->
          <line x1="160" y1="94" x2="160" y2="108" stroke="#f4efe6" stroke-width="1.6"/>
          <!-- torso -->
          <path d="M140 110 Q138 150 142 190 Q150 210 160 212 Q170 210 178 190 Q182 150 180 110 Z" fill="none" stroke="#f4efe6" stroke-width="1.6"/>
          <!-- arms hanging -->
          <path d="M142 118 Q132 150 134 188" fill="none" stroke="#f4efe6" stroke-width="1.6" stroke-linecap="round"/>
          <path d="M178 118 Q188 150 186 188" fill="none" stroke="#f4efe6" stroke-width="1.6" stroke-linecap="round"/>
          <!-- legs -->
          <path d="M150 212 Q148 250 150 290" fill="none" stroke="#f4efe6" stroke-width="1.6" stroke-linecap="round"/>
          <path d="M170 212 Q172 250 170 290" fill="none" stroke="#f4efe6" stroke-width="1.6" stroke-linecap="round"/>

          <!-- three foot points: heel, big-toe mound, little-toe mound -->
          <circle class="dot-pulse" cx="150" cy="300" r="4" fill="#c9a227"/>
          <circle class="dot-pulse" cx="158" cy="300" r="4" fill="#c9a227" style="animation-delay:.4s"/>
          <circle class="dot-pulse" cx="170" cy="300" r="4" fill="#c9a227" style="animation-delay:.8s"/>

          <!-- labels -->
          <text x="150" y="322" fill="#9a8f7a" font-family="Inter" font-size="9" text-anchor="middle">heel</text>
          <text x="158" y="322" fill="#9a8f7a" font-family="Inter" font-size="9" text-anchor="middle">big</text>
          <text x="170" y="322" fill="#9a8f7a" font-family="Inter" font-size="9" text-anchor="middle">little</text>
        </svg>
      </div>

      <div class="controls">
        <button id="play" class="primary">Play</button>
        <button id="reset">Reset</button>
        <div class="status" id="status">Standing</div>
      </div>
      <div class="caption" id="caption">One vertical line from the midfeet through the pelvis to the crown. The mountain does not imagine — it just stands.</div>
    </section>
