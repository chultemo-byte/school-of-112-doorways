<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Door · School of 112 Doorways</title>
<style>
  :root{
    --bg:#0b0a12;
    --ink:#f4efe6;
    --muted:#9a8f7a;
    --gold:#c9a227;
    --vermilion:#c0392b;
    --arch:#c4a56a;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:radial-gradient(1200px 800px at 50% -10%, #1a1530 0%, var(--bg) 55%);
    color:var(--ink);
    font-family:Georgia,serif;
    min-height:100vh;
  }
  .wrap{max-width:680px;margin:0 auto;padding:28px 18px 80px}
  a{color:var(--gold);text-decoration:none}
  .eyebrow{color:var(--gold);letter-spacing:.22em;text-transform:uppercase;font-size:.72rem;font-family:system-ui,sans-serif}
  h1{font-weight:500;font-size:2.2rem;line-height:1.15;margin:10px 0 6px}
  .sa{color:var(--muted);margin:0 0 8px;font-size:1.05rem}
  .house{color:var(--ink);margin:0 0 16px}
  .safety{border:1px solid rgba(255,255,255,.14);border-radius:14px;padding:12px 14px;margin:16px 0;background:rgba(201,162,39,.06)}
  .safety span{display:block;line-height:1.45}
  .mode{border-left:3px solid var(--vermilion);padding:8px 12px;margin:14px 0;background:rgba(192,57,43,.12)}
  .film{border:2px solid var(--arch);border-radius:140px 140px 12px 12px;padding:16px 16px 18px;text-align:center;background:rgba(255,255,255,.03);margin:16px 0}
  .film .who{letter-spacing:.18em;font-size:.72rem;color:var(--vermilion);font-family:system-ui,sans-serif}
  .film video{width:100%;max-height:360px;margin-top:12px;border-radius:12px;background:#000}
  .slot{margin-top:10px;color:var(--muted);line-height:1.5}
  .shots{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:16px 0}
  .shot{border:1px solid rgba(255,255,255,.12);border-radius:10px;padding:10px 6px;text-align:center;background:rgba(255,255,255,.03);min-height:72px}
  .shot b{display:block;font-size:.78rem;margin-bottom:6px}
  .shot span{color:var(--muted);font-size:.72rem;font-family:system-ui,sans-serif}
  .field{margin:14px 0}
  .field b{display:block;color:var(--gold);font-size:.95rem;margin-bottom:4px}
  .field p{margin:0;line-height:1.55}
  .waits{color:var(--muted);font-style:italic}
  .yn{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0}
  .yn div{border:1px solid rgba(255,255,255,.12);border-radius:12px;padding:12px}
  .yn b{display:block;margin-bottom:6px}
  .yn .y{border-color:rgba(201,162,39,.45)}
  .yn .n{border-color:rgba(192,57,43,.45)}
  .meru{border:1px solid rgba(201,162,39,.4);border-radius:16px;padding:14px 16px;margin:18px 0;line-height:1.55;background:linear-gradient(180deg,rgba(201,162,39,.08),rgba(255,255,255,.02))}
  .sealed{font-size:1.25rem;line-height:1.5;margin:18px 0}
  nav{display:flex;justify-content:space-between;gap:12px;margin-top:22px;font-family:system-ui,sans-serif}
  nav .off{color:var(--muted)}
  .status{color:var(--muted);min-height:2.4em}
  .err{color:var(--vermilion)}
  footer{margin-top:28px;color:var(--muted);font-size:.85rem;line-height:1.6}
  @media (max-width:560px){
    .shots{grid-template-columns:repeat(2,1fr)}
    h1{font-size:1.8rem}
  }
</style>
</head>
<body>
  <div class="wrap">
    <div class="eyebrow">Guru Meru</div>
    <div id="app"><p class="status">Loading the pots.</p></div>
  </div>
<script type="application/json" id="plate">{
  "honesty": {
    "1": "This asana and VBT method are linked by the School of 112 Doorways as a teaching device (Door 001 with dharana 001). It is not a claim of ancient one-to-one canon.",
    "2": "Linking Upward Salute to VBT dharana 002 is a School of 112 Doorways teaching device, not a claim of ancient one-to-one canon.",
    "3": "This asana↔method link is a School of 112 Doorways teaching device, not ancient canon. Uttanasana and VBT dharana 003 are paired here by school index.",
    "4": "This asana↔method link is a School of 112 Doorways teaching device, not ancient canon. Half Forward Fold is paired with VBT dharana 004 by school index, not by historical one-to-one tradition.",
    "5": "This Low Lunge and VBT dharana 005 are linked by the School of 112 Doorways as a teaching device (Door 005 with dharana 005). It is not a claim of ancient one-to-one canon.",
    "6": "This asana and VBT method are paired by School of 112 Doorways door number (D-006 with dharana 006). That link is a teaching device, not ancient one-to-one canon.",
    "7": "This asana↔method link is a School of 112 Doorways teaching device, not ancient canon. Plank is paired with VBT dharana 007 by school index, not by historical one-to-one tradition.",
    "8": "Linking Four-Limbed Staff to VBT dharana 008 is a School of 112 Doorways teaching device, not a claim of ancient one-to-one canon.",
    "9": "This asana↔VBT link is a School of 112 Doorways teaching device by door index, not ancient one-to-one canon. Some editions number the same verse differently (e.g. as yukti 6).",
    "10": "This asana↔method link is a School of 112 Doorways teaching device, not ancient canon. Door index 010 is paired with VBT method/dharana 010 by school map.",
    "11": "This asana↔method link is a School of 112 Doorways teaching device, not ancient canon. Warrior II and VBT dharana 011 are paired by school index for teaching, not as a historical one-to-one.",
    "12": "Linking Utthita Trikonasana with VBT method 012 is a School of 112 Doorways teaching device, not an ancient one-to-one claim. The shared image is a slender line of attention (side body in Triangle; central filament in the verse).",
    "13": "This asana and VBT method are paired by School of 112 Doorways index (Door 013 with dharana 013). That link is a teaching device, not a claim of ancient one-to-one canon.",
    "14": "This asana↔method link is a School of 112 Doorways teaching device, not ancient canon. Extended Side Angle and VBT dharana 014 are paired by school index so students can braid a strong side-body geometry with an omnidirectional space contemplation.",
    "15": "This asana↔method link is a School of 112 Doorways teaching device, not ancient canon. Wide-legged fold and dharana 015 are paired by school index, not by classical one-to-one lineage.",
    "16": "This asana↔method link is a School of 112 Doorways teaching device, not ancient canon. Tree and VBT 016 share a modern school rhyme (rooted body, open sky of attention), not a historical one-to-one pairing.",
    "49": "Vijnana Bhairava Tantra. The asana–verse pairing on this door is a School of 112 Doorways device (school_device), not a claim of ancient one-to-one canon.",
    "112": "Vijnana Bhairava Tantra. The asana–verse pairing on this door is a School of 112 Doorways device (school_device), not a claim of ancient one-to-one canon. Lotus is an optional seat, not proof of mastery."
  },
  "modes": {
    "1": "practice",
    "2": "practice",
    "3": "practice",
    "4": "practice",
    "5": "practice",
    "6": "practice",
    "7": "practice",
    "8": "practice",
    "9": "practice",
    "10": "practice",
    "11": "practice",
    "12": "practice",
    "13": "observe_only",
    "14": "practice",
    "15": "practice",
    "16": "practice",
    "49": "practice",
    "112": "observe_only"
  }
}</script>
<script>
(function(){
  var plate = JSON.parse(document.getElementById("plate").textContent);
  var SHOTS = ["Front","Side","Back","Up","Look-here","YES","NO"];
  var MERU_LOCK = "Public name lock 2026-09-26: the visible yogi is Guru Meru.";
  var MERU_DOOR1 = "Guru Meru: Hi. We stand like a mountain. If it hurts, we stop.";

  function pad(n){ return String(n).padStart(3,"0"); }
  function esc(s){
    return String(s).replace(/[&<>"']/g, function(c){
      return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c];
    });
  }
  function readN(){
    var m = location.search.match(/[?&]n=(\d+)/);
    var n = m ? parseInt(m[1], 10) : 1;
    if (isNaN(n)) n = 1;
    if (n < 1) n = 1;
    if (n > 112) n = 112;
    return n;
  }
  function field(label, value){
    if (value == null || value === "") {
      return "<div class=\"field\"><b>" + esc(label) + "</b><p class=\"waits\">waits</p></div>";
    }
    return "<div class=\"field\"><b>" + esc(label) + "</b><p>" + esc(value) + "</p></div>";
  }
  function filmBlock(film){
    if (typeof film === "string" && /\.mp4(\?|#|$)/i.test(film)) {
      return "<video controls src=\"" + esc(film) + "\"></video>";
    }
    return "<div class=\"slot\">" + esc(film == null ? "waits" : film) + "</div>";
  }
  function safety(){
    return "<div class=\"safety\">" +
      "<span>Start on the exhale.</span>" +
      "<span>Soft knees.</span>" +
      "<span>A chair still opens the door.</span>" +
      "<span>If it hurts, stop.</span>" +
      "</div>";
  }
  function nav(n){
    var prev = n > 1
      ? "<a href=\"pose.html?n=" + (n - 1) + "\">← " + pad(n - 1) + "</a>"
      : "<span class=\"off\">← 001</span>";
    var next = n < 112
      ? "<a href=\"pose.html?n=" + (n + 1) + "\">" + pad(n + 1) + " →</a>"
      : "<span class=\"off\">112 →</span>";
    return "<nav>" + prev + "<a href=\"112.html\">112.html</a>" + next + "</nav>";
  }
  function footer(){
    return "<footer><a href=\"breath.html\">breath.html</a> · <a href=\"kids.html\">kids.html</a> · <a href=\"teens.html\">teens.html</a></footer>";
  }
  function shots(){
    return "<div class=\"shots\">" + SHOTS.map(function(name){
      return "<div class=\"shot\"><b>" + esc(name) + "</b><span>not shot yet</span></div>";
    }).join("") + "</div>";
  }
  function render(pot, n){
    var h = "";
    if (!pot || pot.status === "sealed") {
      var house = pot ? pot.house : "";
      var houseName = pot ? pot.house_name : "";
      var bija = pot ? pot.bija : "";
      h += "<h1>Door " + pad(n) + "</h1>";
      h += "<p class=\"sealed\">This pot exists. The name waits. Null is not a secret name.</p>";
      h += "<p class=\"house\">House " + esc(house) + " · " + esc(houseName) + " · " + esc(bija) + "</p>";
      h += safety();
      document.title = pad(n) + " · waiting · School of 112 Doorways";
    } else {
      h += "<h1>" + esc(pot.en) + "</h1>";
      h += "<p class=\"sa\">" + esc(pot.sa) + "</p>";
      h += field("Guardian", pot.guardian);
      h += "<p class=\"house\">House " + esc(pot.house) + " · " + esc(pot.house_name) + " · " + esc(pot.bija) + "</p>";
      h += safety();
      var mode = plate.modes[String(n)];
      if (mode === "observe_only") {
        h += "<p class=\"mode\">Practice mode: observe_only.</p>";
      }
      h += "<div class=\"film\"><div class=\"who\">GURU MERU DEMONSTRATES</div>" + filmBlock(pot.film) + "</div>";
      h += shots();
      h += field("Look here", pot.look);
      h += field("Water", pot.water);
      h += field("Geometry", pot.geo);
      h += "<div class=\"yn\"><div class=\"y\"><b>YES</b>" + (pot.yes == null ? "<p class=\"waits\">waits</p>" : "<p>" + esc(pot.yes) + "</p>") + "</div>";
      h += "<div class=\"n\"><b>NO</b>" + (pot.no == null ? "<p class=\"waits\">waits</p>" : "<p>" + esc(pot.no) + "</p>") + "</div></div>";
      h += field("Exit", pot.exit);
      h += field("Benefits", pot.benefits);
      h += "<div class=\"meru\"><p>" + esc(MERU_LOCK) + "</p>";
      if (n === 1) h += "<p>" + esc(MERU_DOOR1) + "</p>";
      var honest = plate.honesty[String(n)];
      if (honest) h += "<p>" + esc(honest) + "</p>";
      h += "</div>";
      document.title = pad(n) + " · " + pot.en + " · School of 112 Doorways";
    }
    h += nav(n);
    h += footer();
    document.getElementById("app").innerHTML = h;
  }
  function fail(msg){
    document.getElementById("app").innerHTML = "<p class=\"err\">The pots did not load.</p><p class=\"status\">" + esc(msg) + "</p>" + safety() + footer();
  }
  function fetchJson(url, ms){
    var ctrl = new AbortController();
    var timer = setTimeout(function(){ ctrl.abort(); }, ms);
    return fetch(url, { signal: ctrl.signal }).then(function(r){
      if (!r.ok) throw new Error(url + " " + r.status);
      return r.json();
    }).finally(function(){ clearTimeout(timer); });
  }
  function loadPart(n){
    var cdn = "https://cdn.jsdelivr.net/gh/chultemo-byte/school-of-112-doorways@main/public/doors-part" + n + ".json";
    var rel = "../public/doors-part" + n + ".json";
    return fetchJson(cdn, 6000).then(function(data){
      if (!Array.isArray(data)) throw new Error("cdn shape");
      return data;
    }).catch(function(){
      return fetchJson(rel, 6000).then(function(data){
        if (!Array.isArray(data)) throw new Error("relative shape");
        return data;
      });
    });
  }
  var n = readN();
  Promise.all([1,2,3,4].map(loadPart)).then(function(parts){
    var pots = parts.reduce(function(all, part){ return all.concat(part); }, []);
    var pot = null;
    for (var i = 0; i < pots.length; i++) {
      if (pots[i] && pots[i].number === n) { pot = pots[i]; break; }
    }
    if (!pot) { fail("Door " + n + " is not in the registry."); return; }
    render(pot, n);
  }).catch(function(err){
    fail(err && err.message ? err.message : "load failed");
  });
})();
</script>
</body>
</html>
