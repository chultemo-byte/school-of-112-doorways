<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Door · School of 112 Doorways</title>
<style>
  body{margin:0;background:#0b0a12;color:#f4efe6;font-family:Georgia,serif}
  .wrap{max-width:640px;margin:0 auto;padding:28px 18px}
  .eyebrow{color:#c9a227;letter-spacing:.22em;text-transform:uppercase;font-size:.72rem}
  a{color:#c9a227}
</style>
</head>
<body>
  <div class="wrap">
    <div class="eyebrow">Guru Meru · 001 mold locked</div>
    <p id="app">Opening the pot.</p>
  </div>
<script>
(function(){
  var m=location.search.match(/[?&]n=(\d+)/);
  var n=m?parseInt(m[1],10):1;
  if(n<1)n=1; if(n>112)n=112;
  if(n===1){ location.replace("door-001.html"); return; }
  if(n===2){ location.replace("door-002.html"); return; }
  var named=(n>=1&&n<=16)||n===49||n===112;
  var houses=["M\u016bl\u0101dh\u0101ra","Sv\u0101dhi\u1e63\u1e6dh\u0101na","Ma\u1e47ip\u016bra","An\u0101hata","Vi\u015buddha","\u0100j\u00f1\u0101","Sahasr\u0101ra"];
  var bijas=["LAM","VAM","RAM","YAM","HAM","OM","OM"];
  var h=Math.ceil(n/16);
  var pad=String(n).padStart(3,"0");
  document.getElementById("app").innerHTML = named
    ? "<h1>Door "+pad+"</h1><p>The plate is in the constructor pots. Film waits.</p><p><a href=\"door-001.html\">001 mold</a> · <a href=\"door-002.html\">002 Sky Reach</a></p>"
    : "<h1>Door "+pad+"</h1><p>This pot is sealed. A name will arrive honestly.</p><p>House "+h+" · "+houses[h-1]+" · "+bijas[h-1]+"</p><p>If it hurts, stop. A chair still opens the door.</p><p><a href=\"door-002.html\">002</a> · <a href=\"door-001.html\">001</a></p>";
})();
</script>
</body>
</html>
