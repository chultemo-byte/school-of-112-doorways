<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Pose · School of 112 Doorways</title>
<style>
:root{--parch:#e8d7b4;--ink:#3a2a18;--muted:#7a5e3a;--vermilion:#9c2b1a;--arch:#c4a56a}
*{box-sizing:border-box}html,body{margin:0;padding:0}
body{background:#2b2116;color:var(--ink);font-family:Georgia,serif}
.page{max-width:560px;margin:0 auto;background:linear-gradient(180deg,#f0e0c0,#e4cf9e);min-height:100vh;padding:24px 20px 72px}
.title{text-align:center;letter-spacing:.28em;font-size:.78rem;color:var(--vermilion);text-transform:uppercase}
h1{text-align:center;font-weight:500;font-size:2rem;margin:8px 0 4px}
.sa{text-align:center;color:var(--muted);margin:0 0 16px}
.arch{border:2px solid var(--arch);border-radius:180px 180px 12px 12px;padding:16px 14px 20px;text-align:center;background:rgba(255,255,255,.18);margin:16px 0}
.arch .who{letter-spacing:.2em;font-size:.7rem;color:var(--vermilion)}
.arch p{margin:10px 0 0;line-height:1.5}
.spot{border-left:3px solid var(--vermilion);padding:8px 12px;margin:14px 0;background:rgba(156,43,26,.08)}
.law{font-size:.95rem;line-height:1.55;margin:10px 0}
.wait{border:1px dashed var(--arch);padding:18px;margin:18px 0;text-align:center;color:var(--muted)}
.film{border:1px solid var(--arch);border-radius:12px;padding:14px;margin:14px 0;text-align:center;background:rgba(255,255,255,.2)}
.film b{display:block;letter-spacing:.16em;font-size:.7rem;color:var(--vermilion);margin-bottom:6px}
nav{display:flex;justify-content:space-between;margin-top:22px;font-size:.9rem}
a{color:var(--vermilion)}
footer{margin-top:24px;font-size:.78rem;color:var(--muted);text-align:center}
</style>
</head>
<body>
<div class="page" id="app">Loading pot…</div>
<script>
(function(){
  var HOUSES=[
    {n:1,name:"Mūlādhāra",range:[1,16],bija:"LAM"},
    {n:2,name:"Svādhiṣṭhāna",range:[17,32],bija:"VAM"},
    {n:3,name:"Maṇipūra",range:[33,48],bija:"RAM"},
    {n:4,name:"Anāhata",range:[49,64],bija:"YAM"},
    {n:5,name:"Viśuddha",range:[65,80],bija:"HAM"},
    {n:6,name:"Ājñā",range:[81,96],bija:"OM"},
    {n:7,name:"Sahasrāra",range:[97,112],bija:"silence"}
  ];
  var POTS={
    1:{en:"Mountain",sa:"Tāḍāsana",g:"MERU",look:"heel, big-toe pad, little-toe pad",water:"Start on the exhale. Mist at the feet. Inhale — mist climbs. Exhale — mist falls. Six loops. 4 and 4. No hold.",geo:"Vertical column on a three-point base. Soft knees.",yes:"soft knees, even three points",no:"locked legs, fidgeting feet",exit:"If it hurts, sit. A chair is still the mountain.",steps:"Stand. Soft knees. Smell a flower 4. Blow a bubble 4. Six times. Green or red light.",benefit:"Wakes the feet. Settles fidgeting. Gives the school its axis.",film:"Guru Meru stands. Same camera every later door copies."},
    2:{en:"Sky Reach",sa:"Ūrdhva Hastāsana",g:"ŪRDHVA",look:"the hinge — belly and hips",water:"Start on the exhale, arms hanging. Inhale — arms rise on 4. Soft one-count at the top. Exhale — mist falls, arms stay up.",geo:"Mountain base. Arms overhead. Shoulders drop away from the ears.",yes:"quiet ribs, soft shoulders",no:"shrugged ears, tipping back",exit:"Shoulders at the ears = arms down.",steps:"Mountain first. Arms up. Do not shrug. Flower 4, quiet, bubble 4.",benefit:"Opens the side body. Teaches reach without shrug.",film:"Guru Meru reaches. Arms stay up so this is not waving Mountain."},
    3:{en:"Ragdoll Fold",sa:"Uttanāsana",g:"NAMAH",look:"the sacrum — the triangle bone",water:"4 in, 6 out. Come up like a sleepy cat.",geo:"Hinge at the hips. Knees bend freely. Head is heavy and soft.",yes:"soft knees, heavy head",no:"yanked neck, locked legs",exit:"If it hurts or spins, bend more or stand up slow.",steps:"Tip from the hips. Hang. Do not yank the head. Come up slow.",benefit:"Lets the head be heavy. Softens the back of the legs without a prize.",film:"Guru Meru hangs. Head soft. Mist to the sacrum."},
    4:{en:"Half Fold",sa:"Ardha Uttanāsana",g:"ARDHA",look:"length from tailbone through crown",water:"Inhale 4 to lift long. Soft pause 2. Exhale 4.",geo:"Torso roughly parallel to the floor. Hands on shins, thighs, or a chair.",yes:"long spine",no:"hands on the knee joints",exit:"Hands never on the knees. If it hurts, stop.",steps:"From the hang, inhale to a long back. Hands on shins, never knees.",benefit:"Builds a long back without forcing the fold.",film:"Storyboard until a clean long-back clip exists. No fire-mist."},
    5:{en:"Low Lunge",sa:"Añjaneyāsana",g:"AÑJANA",look:"back knee and the front hip crease",water:"4 in, 4 out. Lengthen on the inhale. Settle the hips on the exhale without collapsing.",geo:"Front knee over ankle. Back knee down. Torso tall.",yes:"front knee tracking",no:"dumped inner knee or yanked lumbar",exit:"Pad the back knee. High lunge if kneeling is unavailable.",steps:"Right foot forward. Back knee padded. Tall spine. Switch sides.",benefit:"Opens the front of the back-leg hip. Teaches a tall lunge.",film:"Guru Meru lunges. Front knee over ankle."},
    6:{en:"Down Dog",sa:"Adho Mukha Śvānāsana",g:"ŚVANA",look:"one line from hands through spine to heels",water:"4 in, 6 out. Inhale lengthen the waist. Exhale root the hands.",geo:"Inverted V. Hips the peak. Knees may bend. Heels do not have to touch.",yes:"bent knees welcome",no:"forced heels, dumped shoulders",exit:"Puppy pose is still this door. If wrists complain, stop.",steps:"Hands and feet. Hips up. Soft knees. Heels may float.",benefit:"Lengthens the back body. Rests the head below the heart.",film:"Guru Meru film waiting on this pot."},
    7:{en:"Plank",sa:"Phalakāsana",g:"PHALA",look:"one board from shoulders through hips to heels",water:"4 and 4. Ordinary breath. No hero hold.",geo:"Long line. Knees-down plank still counts.",yes:"hips in line",no:"sagging low back",exit:"Drop the knees. If it hurts, stop.",steps:"Long board. Soft breath. Knees may rest.",benefit:"Wakes the middle. Teaches one line without a contest.",film:"Guru Meru film waiting on this pot."},
    8:{en:"Four-Limbed Staff",sa:"Caturaṅga Daṇḍāsana",g:"DAṆḌA",look:"elbows hugging the ribs",water:"Exhale to lower. Do not hover in pain.",geo:"Lowered plank. Elbows over wrists. Optional.",yes:"elbows by ribs",no:"collapsed shoulders",exit:"Knees down or skip. This door is optional.",steps:"Lower on an exhale. Elbows in. Or skip.",benefit:"Strengthens arms when honest. Optional is still the door.",film:"Guru Meru film waiting on this pot."},
    9:{en:"Up Dog",sa:"Ūrdhva Mukha Śvānāsana",g:"MUKHA",look:"pubic bone down, chest lifting",water:"Inhale to open. 4 and 4.",geo:"Tops of feet press. Thighs may stay down. Cobra is the twin.",yes:"chest width",no:"dumped lumbar, cranked neck",exit:"If the low back argues, take Cobra or stop.",steps:"Press the tops of the feet. Lift the chest. Soft neck.",benefit:"Opens the front body. Twin of Cobra.",film:"Guru Meru film waiting on this pot."},
    10:{en:"Warrior I",sa:"Vīrabhadrāsana I",g:"VĪRA I",look:"outer edge of the back foot and the upward reach",water:"Inhale lengthen. Exhale root the back heel. 4 and 4.",geo:"Staggered stance, hip-width tracks. Arms up. Do not force the pelvis square.",yes:"back heel grounded",no:"tightrope feet, wrenched back knee",exit:"Crescent (heel up) is still this door.",steps:"Stagger the feet. Front knee tracks. Arms up. Switch sides.",benefit:"Roots one heel while the arms reach.",film:"Guru Meru film waiting on this pot."},
    11:{en:"Warrior II",sa:"Vīrabhadrāsana II",g:"VĪRA II",look:"front knee over the ankle",water:"4 and 4. Gaze over the front hand.",geo:"Open hips. Front thigh aims toward parallel only as far as the knee stays honest.",yes:"knee tracks second toe",no:"dumped inner knee",exit:"Shorten the stance. If it hurts, stop.",steps:"Open the hips. Gaze over the front hand. Switch sides.",benefit:"Teaches an open stance without dumping the knee.",film:"Guru Meru film waiting on this pot."},
    12:{en:"Triangle",sa:"Utthita Trikoṇāsana",g:"TRIKOṆA",look:"front inner heel and the long side body — not the floor hand",water:"4 and 4.",geo:"Long legs. Hand on shin or block.",yes:"stacked hips as honest as they are",no:"hanging on the front knee",exit:"Block under the hand. If it hurts, stop.",steps:"Long legs. Hand to shin or a block. Look where the neck is kind.",benefit:"Lengthens the side body. The floor is not the prize.",film:"Guru Meru film waiting on this pot."},
    13:{en:"Revolved Triangle",sa:"Parivṛtta Trikoṇāsana",g:"PARIVṞTTA",look:"the turning navel. Twist from the belly, not the neck.",water:"Inhale length. Exhale a small honest twist.",geo:"Long stance. Hand on a block.",yes:"twist from the belly",no:"cranked neck",exit:"Skip if the back argues.",steps:"Length first. Small twist. Neck last.",benefit:"A small honest twist is the whole door.",film:"Guru Meru film waiting on this pot."},
    14:{en:"Side Angle",sa:"Utthita Pārśvakoṇāsana",g:"PĀRŚVA",look:"underside of the long rib, heel to top hand",water:"4 and 4. Forearm on the thigh is the door.",geo:"Warrior II base. Long side body.",yes:"forearm on thigh",no:"dumped front knee",exit:"Stay high. If it hurts, stop.",steps:"Warrior II base. Forearm on the thigh. Long side.",benefit:"Opens the long rib without collapsing the knee.",film:"Guru Meru film waiting on this pot."},
    15:{en:"Wide Fold",sa:"Prasārita Pādottānāsana",g:"PRASĀRITA",look:"inner arches and the hanging crown",water:"4 in, 6 out.",geo:"Wide feet. Hinge. Hands to a chair if the floor is far.",yes:"soft knees",no:"yanked head, locked legs",exit:"Come up slow. If it spins, stop.",steps:"Wide feet. Hinge. Soft knees. Come up slow.",benefit:"A wide hang that does not yank the neck.",film:"Guru Meru film waiting on this pot."},
    16:{en:"Tree",sa:"Vṛkṣāsana",g:"VṚKṢA",look:"standing sole and inner standing thigh",water:"4 and 4. Exhale into the standing foot.",geo:"Foot on inner thigh or calf — never the knee. Wall welcome.",yes:"foot on calf",no:"foot on the knee joint",exit:"Wobble is information. Both feet down is still Tree.",steps:"Stand on one foot. Other foot on calf or thigh, never the knee. Wall welcome.",benefit:"One standing foot. Wobble is the teacher.",film:"Guru Meru film waiting on this pot."},
    49:{en:"Cobra",sa:"Bhujaṅgāsana",g:"NĀGINĪ",look:"width across the heart, not height",water:"4 in, 6 out. No retention.",geo:"Rising arc. Pubic bone heavy.",yes:"lower cobra",no:"higher head as a prize",exit:"If the low back argues, take Sphinx or rest.",steps:"Belly down. Hands under the shoulders. Lift a little. Width, not height.",benefit:"Wakes the back body. Height is not the prize.",film:"Guru Meru film waiting on this pot."},
    112:{en:"Lotus",sa:"Padmāsana",g:"PADMA",look:"the center of the chest",water:"4 in, 6 out. Mild pause after exhale only if easy.",geo:"Hips lead. Knees follow. Chair is the twin.",yes:"a seat you can leave",no:"hauled foot, arguing knee",exit:"NEVER force lotus. The chair is the door.",steps:"Sit. Hips first. If the knee argues, sit in a chair. That is still Lotus.",benefit:"A seat that can stay. A chair still opens Door 112.",film:"Guru Meru sits. Never force the flower."}
  };
  function houseOf(n){for(var i=0;i<HOUSES.length;i++){var h=HOUSES[i];if(n>=h.range[0]&&n<=h.range[1])return h;}return HOUSES[0];}
  function pad(n){return (n<10?"00":n<100?"0":"")+n;}
  var n=parseInt((location.search.match(/[?&]n=(\d+)/)||[])[1]||"1",10);
  if(isNaN(n)||n<1||n>112)n=1;
  var h=houseOf(n);
  var p=POTS[n];
  var prev=n===1?112:n-1, next=n===112?1:n+1;
  var html="";
  html+="<div class=\"title\">Guru Meru</div>";
  if(!p){
    html+="<h1>Door "+pad(n)+"</h1>";
    html+="<p class=\"sa\">House "+h.n+" · "+h.name+" · "+h.bija+"</p>";
    html+="<div class=\"film\"><b>GURU MERU</b>This pot exists. The name waits. Null is not a secret name. The body is ready when the name is true.</div>";
    html+="<div class=\"wait\"><p>Look here, water, and exit will be poured when this door is named.</p></div>";
  } else {
    html+="<h1>"+p.en+"</h1>";
    html+="<p class=\"sa\">Door "+pad(n)+" · "+p.sa+" · "+p.g+" · House "+h.n+"</p>";
    html+="<div class=\"film\"><b>GURU MERU DEMONSTRATES</b>"+p.film+"</div>";
    html+="<div class=\"arch\"><div class=\"who\">THE WATER</div><p>"+p.water+"</p></div>";
    html+="<div class=\"spot\"><b>Look here:</b> "+p.look+"</div>";
    html+="<p class=\"law\"><b>Steps:</b> "+p.steps+"</p>";
    html+="<p class=\"law\"><b>Geometry:</b> "+p.geo+"</p>";
    html+="<p class=\"law\"><b>Yes:</b> "+p.yes+" · <b>No:</b> "+p.no+"</p>";
    html+="<p class=\"law\"><b>Benefit:</b> "+p.benefit+"</p>";
    html+="<p class=\"law\"><b>Exit:</b> "+p.exit+"</p>";
  }
  html+="<nav><a href=\"pose.html?n="+prev+"\">← "+pad(prev)+"</a><a href=\"112.html\">city</a><a href=\"pose.html?n="+next+"\">"+pad(next)+" →</a></nav>";
  html+="<footer>112 pots. Guru Meru walks each door. Practice is not medicine. <a href=\"breath.html\">the water</a></footer>";
  document.getElementById("app").innerHTML=html;
  document.title=pad(n)+" · "+(p?p.en:"waiting")+" · Guru Meru";
})();
</script>
</body>
</html>
